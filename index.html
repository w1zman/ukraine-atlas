<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ukraine Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive 3D map of Ukraine's regions with live air-raid alerts, night lights from space, the front line, refugees and aid, and Black Sea shipping.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D map; floating title + mode chips on top; an info sheet docks at the bottom on phones and as a right-hand column on wide screens.
   One deliberate night-time look (situation-room dark), so a single palette serves every viewer. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;
  --night:#0a111c; --europe:#121c2d; --europe-edge:#28375a;
  --land:#1d2c46; --land-hi:#2b4170; --edge:#6a86b6;
  --panel:#0e1727; --panel-2:#15213a; --line:#25344f;
  --text:#eef2f8; --muted:#9eadc6; --faint:#6f7f9b;
  --wheat:#f4c542; --wheat-ink:#1b1505; --sky:#5c9df2;
  --alert:#ff4d4f; --alert-soft:#a83c47; --drone:#ffa53e; --drone-soft:#9a6a2c;
  --occ:#c8505f; --ok:#5cc98f;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Commissioner","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-map{overflow:hidden;position:relative;-webkit-tap-highlight-color:rgba(0,0,0,0)}
.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
#map.locked .maplibregl-canvas-container.maplibregl-interactive{cursor:default}
.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate,.maplibregl-canvas-container.maplibregl-touch-drag-pan{touch-action:none}
.maplibregl-marker{position:absolute;left:0;top:0;will-change:transform}
.map-fail{position:absolute;inset:0;display:grid;place-items:center;padding:0 24px;text-align:center;color:var(--muted)}

/* top bar */
.top{position:absolute;z-index:5;top:10px;left:0;right:0;display:flex;flex-direction:column;gap:8px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.glass{background:rgba(10,17,28,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;border-radius:12px;padding:0 12px 0 10px;height:38px;box-sizing:border-box;min-width:0;flex:0 1 auto}
.mark{flex:none;width:14px;height:14px;border-radius:3px;background:linear-gradient(var(--sky) 0 50%,var(--wheat) 50% 100%)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.03em;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:0 13px;height:38px;box-sizing:border-box;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;min-width:0}
.pill .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--faint)}
.pill[data-s="alert"] .dot{background:var(--alert);box-shadow:0 0 0 0 rgba(255,77,79,.6);animation:pulse 1.8s infinite}
.pill[data-s="clear"] .dot{background:var(--ok)}
.pill[data-s="loading"] .dot{background:var(--wheat)}
.pill[data-s="error"] .dot{background:var(--faint)}
.pill .ptxt{overflow:hidden;text-overflow:ellipsis}
.pill .short{display:none}
@media (max-width:560px){.pill .long{display:none}.pill .short{display:inline}.brand h1{font-size:13px}}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,77,79,0)}100%{box-shadow:0 0 0 0 rgba(255,77,79,0)}}
.right{display:flex;align-items:center;gap:8px;min-width:0}
.iconbtn{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--text)}
.iconbtn svg{width:18px;height:18px}
.iconbtn:hover{border-color:var(--edge)}
#fsAlerts{position:absolute;z-index:8;top:10px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 52px);height:44px;max-width:calc(100% - 100px)}
#fsCard{position:absolute;z-index:8;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:12px;max-height:48%;overflow-y:auto;overscroll-behavior:contain;border-radius:16px;padding:12px 16px 16px;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
#fsCard .cardx{position:sticky;top:0;align-self:flex-end;margin-bottom:-46px;z-index:1;width:36px;height:36px;background:var(--panel-2);border:1px solid var(--line)}
#fsCard h2{padding-right:44px}
body.fs .amenu{right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){#fsCard{left:auto;width:400px;max-height:70%}}
.tbar{position:absolute;z-index:7;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:12px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;align-items:center;border-radius:16px;padding:8px 14px 8px 8px;box-sizing:border-box}
.tbar .iconbtn{grid-row:1 / span 2;width:44px;height:44px;border-radius:12px;background:var(--wheat);border-color:var(--wheat);color:var(--wheat-ink)}
.tbar .iconbtn svg{width:18px;height:18px}
.ttop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.tdate{font-family:var(--f-display);font-weight:500;font-size:14px;white-space:nowrap}
.tarea{font:500 12px var(--f-mono);color:var(--occ);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbar .slider{margin:0;height:22px}
.tticks{grid-column:2;display:flex;justify-content:space-between;font:400 10px var(--f-mono);color:var(--faint);margin-top:-4px}
@media (min-width:900px){.tbar{right:404px;max-width:560px;bottom:16px}}
body.fs .tbar{right:max(16px,env(safe-area-inset-right,0px))}
.tbar.docked{position:relative;left:auto;right:auto;bottom:auto;flex:none;max-width:none;margin:2px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel-2);border-color:var(--line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
@media (min-width:900px){.tbar.docked{margin:16px 20px 0}}
#fsClose{position:absolute;z-index:8;top:10px;right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px}
body.fs .top,body.fs .panel{display:none}
.modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-inline:16px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,transparent 0,#000 10px,#000 calc(100% - 32px),transparent)}
.modes::after{content:"";flex:none;width:8px}
.modes::-webkit-scrollbar{display:none}
.mode{flex:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.mode[aria-selected="true"]{background:var(--wheat);border-color:var(--wheat);color:var(--wheat-ink)}
.mode:hover{color:var(--text)}
.mode[aria-selected="true"]:hover{color:var(--wheat-ink)}

/* labels on map */
.rlabel{font:500 11px/1.1 var(--f-body);color:#dfe7f5;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.8);pointer-events:none;white-space:nowrap;transform:translateY(-2px)}
.rlabel.sel{color:var(--wheat);font-weight:600}
.mlabel{font:600 11px/1.2 var(--f-body);color:var(--text);background:rgba(10,17,28,.82);border:1px solid var(--line);border-radius:6px;padding:3px 6px;white-space:nowrap;pointer-events:none}
.mlabel b{font-family:var(--f-mono);font-weight:500;color:var(--wheat);margin-left:4px}
.mlabel.aid b{color:var(--sky)}
.mlabel.dim{color:var(--muted)}
.hide-labels .rlabel{display:none}
.amenu{position:absolute;z-index:9;right:max(16px,env(safe-area-inset-right,0px));width:min(400px,calc(100% - 32px));max-height:min(68vh,640px);overflow-y:auto;overscroll-behavior:contain;border-radius:16px;padding:12px 10px 14px;background:rgba(12,19,32,.97);border:1px solid var(--line);box-shadow:0 18px 44px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
@media (min-width:900px){.amenu{right:404px}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 4px}
.mhead b{font-size:15px}
.msec{display:flex;flex-direction:column;gap:1px}
.mh{font:500 11px/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 6px 4px}
.mlist{display:flex;flex-direction:column;gap:1px}
.mi{display:grid;grid-template-columns:46px minmax(0,1fr) 12px;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:10px;cursor:pointer;color:var(--text);font-size:14px}
.mi:hover{background:var(--panel-2)}
.mi.static{cursor:default}
.mi.static:hover{background:none}
.mt{font:500 12px/1.5 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.mx{min-width:0}
.mx b{display:block;font-weight:600;line-height:1.35}
.mx span{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
.go{color:var(--faint);font-size:18px;line-height:1}
.lv{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px;background:var(--faint)}
.lv.red{background:var(--alert)} .lv.yellow{background:var(--drone)} .lv.blast{background:#ffb347;box-shadow:0 0 0 3px rgba(255,179,71,.25)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mchips{padding:0 6px 8px 60px}
.ach{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--text)}
.ach:hover{border-color:var(--edge)}
.chip.blast i{background:#ffb347}
.q{margin:0;border-left:3px solid var(--line);padding:4px 0 4px 12px;color:#dfe6f2;display:flex;flex-direction:column;gap:4px}
.focus-label{border-color:var(--wheat);color:var(--wheat)}
.tip{position:absolute;z-index:7;pointer-events:none;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap}

/* panel */
.panel{position:absolute;z-index:6;left:0;right:0;bottom:0;max-height:45%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 32px rgba(0,0,0,.4);transition:max-height .28s ease}
.panel.expanded{max-height:86%}
.grip{flex:none;display:flex;justify-content:center;align-items:center;height:22px;border:0;background:none;cursor:pointer;width:100%}
.grip::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line)}
.pbody{overflow-y:auto;overscroll-behavior:contain;padding-block:2px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){
  .top{right:404px}
  .panel{left:auto;right:max(16px,env(safe-area-inset-right,0px));top:12px;bottom:12px;width:372px;max-height:none;border:1px solid var(--line);border-radius:16px}
  .grip{display:none}
  .pbody{padding:18px 20px 24px}
}
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
h2{margin:4px 0 0;font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.2;text-wrap:balance}
h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.uk{color:var(--muted);font-size:14px;margin-top:2px}
.lead{margin:0;color:var(--muted);max-width:62ch}
.sec{display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.stats div{min-width:0}
.stats dt{font-size:12px;color:var(--faint)}
.stats dd{margin:2px 0 0;font-family:var(--f-display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.stats dd small{font:400 11px var(--f-mono);color:var(--faint);margin-left:3px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.big div{background:var(--panel-2);border-radius:12px;padding:10px 12px;min-width:0}
.big b{display:block;font-family:var(--f-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.15}
.big span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.big .w b{color:var(--wheat)}
.big .r b{color:var(--occ)}
.facts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:#d6deeb}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;background:var(--panel-2);align-self:flex-start}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.chip.red i{background:var(--alert)} .chip.yellow i{background:var(--drone)} .chip.clear i{background:var(--ok)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel-2);border-radius:12px;padding:10px 12px;cursor:pointer;border:0;width:100%;text-align:left}
.switch .t{font-weight:600}
.switch .s{display:block;font-size:12px;color:var(--muted);font-weight:400}
.knob{flex:none;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--text);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--alert)}
.switch[aria-checked="true"] .knob::after{transform:translateX(17px)}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.sw.hatch{background:repeating-linear-gradient(135deg,var(--occ) 0 2px,transparent 2px 5px);border:1px solid var(--occ)}
.list{display:grid;grid-template-columns:1fr;gap:2px}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:8px 6px;border-radius:8px;text-align:left;cursor:pointer;color:var(--text)}
.li:hover{background:var(--panel-2)}
.li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;flex:none}
.tag{font:500 11px var(--f-mono);padding:2px 6px;border-radius:5px;background:var(--panel-2);color:var(--muted);font-variant-numeric:tabular-nums}
.tag.red{background:rgba(255,77,79,.18);color:#ff8a8b}
.tag.yellow{background:rgba(255,165,62,.18);color:#ffc078}
.tag.occ{background:rgba(200,80,95,.16);color:#e48b96}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--edge)}
.btn.ghost{background:none}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .btn[aria-pressed="true"]{background:var(--wheat);border-color:var(--wheat);color:var(--wheat-ink)}
.notice{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);background:rgba(255,255,255,.02)}
.notice b{color:var(--text)}
.meta{font:400 11px/1.4 var(--f-mono);color:var(--faint)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(78px,32%) 1fr auto;align-items:center;gap:8px;font-size:13px}
.bar-row .lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;border-radius:4px;background:var(--panel-2);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.bar-row .val{font:500 12px var(--f-mono);color:var(--text);font-variant-numeric:tabular-nums;text-align:right;min-width:56px}
.fill-w{background:var(--wheat)} .fill-s{background:var(--sky)} .fill-r{background:var(--occ)} .fill-g{background:#8fa3c4}
.fill-note{background:repeating-linear-gradient(135deg,var(--wheat) 0 3px,rgba(244,197,66,.35) 3px 6px)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--faint)}
.slider{width:100%;accent-color:var(--wheat)}
.date{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color-scheme:dark}
.src{font-size:12px;color:var(--faint);display:flex;flex-direction:column;gap:3px}
.src a{color:var(--muted)}
.disclaimer{font-size:12px;color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <div id="map" role="application" aria-label="Interactive map of Ukraine"></div>
  <header class="top">
    <div class="bar">
      <div class="brand glass"><span class="mark" aria-hidden="true"></span><h1>Ukraine Atlas</h1></div>
      <div class="right">
        <button class="pill glass" id="livePill" data-s="loading" aria-live="polite" aria-haspopup="dialog" aria-expanded="false" aria-controls="alertMenu"><span class="dot" aria-hidden="true"></span><span class="ptxt"><span class="long">Checking alerts…</span><span class="short">Checking…</span></span></button>
        <button class="iconbtn glass" id="fsOpen" aria-label="Show map full screen" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <nav class="modes" role="tablist" aria-label="Map views">
      <button class="mode glass" role="tab" data-mode="regions">Regions &amp; alerts</button>
      <button class="mode glass" role="tab" data-mode="night">Night lights</button>
      <button class="mode glass" role="tab" data-mode="front">Front line</button>
      <button class="mode glass" role="tab" data-mode="refugees">Refugees &amp; aid</button>
      <button class="mode glass" role="tab" data-mode="blacksea">Black Sea</button>
    </nav>
  </header>
  <aside class="panel" id="panel" aria-label="Details">
    <button class="grip" id="grip" aria-label="Expand details" aria-expanded="false"></button>
    <div class="pbody" id="pbody"></div>
  </aside>
  <div class="tip glass" id="tip" hidden></div>
  <div class="amenu" id="alertMenu" role="dialog" aria-label="Live alerts" hidden></div>
  <button class="pill glass" id="fsAlerts" data-s="loading" aria-haspopup="dialog" aria-controls="alertMenu" hidden><span class="dot" aria-hidden="true"></span><span class="ptxt">Alerts</span></button>
  <section class="fscard" id="fsCard" aria-label="Alert details" hidden></section>

  menu.hidden = false;

}
function closeMenu() { menu.hidden = true; $('#livePill').setAttribute('aria-expanded', 'false'); }
menu.addEventListener('click', e => {
  const it = e.target.closest('[data-item]');
  if (it) { focusItem(it.dataset.item); return; }
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if (b.dataset.action === 'closemenu') closeMenu();
  if (b.dataset.action === 'retry') { state.live.status = 'loading'; applyAlerts(); renderMenu(); refreshAlerts(); }
  if (b.dataset.action === 'liveon') { state.liveOn = true; state.live.status = 'loading'; applyAlerts(); renderMenu(); renderPanel(); refreshAlerts(); }
});
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && !e.target.closest('#livePill, #fsAlerts')) closeMenu(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { closeMenu(); $('#livePill').focus(); } });


/* ---------------- Interactions ---------------- */
let playing = false, playT = null;
function setMode(m, animate = true) {
  state.mode = m;
  if (m !== 'regions' && m !== 'front' && state.selected) setSelected(null, false, true);
  if (m !== 'regions' && state.focusItem) clearFocus(true);
  closeMenu();
  try { history.replaceState(null, '', '#' + m); } catch (e) { location.hash = m; }
  document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  const active = document.querySelector(`.mode[data-mode="${m}"]`);
  if (active && active.scrollIntoView) active.scrollIntoView({block: 'nearest', inline: 'nearest'});
  if (m !== 'front') stopPlay();
  tip.hidden = true;
  renderPanel();
  applyMode(animate);
  if (m === 'night') renderPanel();
}
function setSelected(id, fly, silent) {
  if (id && state.focusItem) clearFocus(true);
  if (mapReady && state.selected) map.setFeatureState({source: 'regions', id: state.selected}, {sel: false});
  state.selected = id;
  markers.regions.forEach(m => m.getElement().classList.toggle('sel', m.rid === id));
  if (mapReady && id) {
    map.setFeatureState({source: 'regions', id}, {sel: true});
    if (fly && state.mode === 'regions') {
      const c = R[id].lab, z = Math.max(map.getZoom(), id === 'UA-30' || id === 'UA-40' ? 7 : 5.6);
      const o = {center: c, zoom: z, padding: padding()};
      REDUCED ? map.jumpTo(o) : map.easeTo({...o, duration: 900});
    }
  }
  if (!silent && state.mode === 'regions') renderPanel();
}
function stopPlay() { playing = false; clearInterval(playT); }
function togglePlay() {
  if (playing) { stopPlay(); renderPanel(); return; }
  playing = true;
  if (state.frontIdx === DATA.front.snapshots.length - 1) setFrontIdx(0); else renderPanel();
  playT = setInterval(() => {
    const n = state.frontIdx + 1;
    if (n >= DATA.front.snapshots.length) { stopPlay(); renderPanel(); return; }
    setFrontIdx(n);
  }, REDUCED ? 2000 : 1100);
}
function setFrontIdx(i) {
  state.frontIdx = i;
  setOcc(i);
  if (mapReady) map.setLayoutProperty('occ-latest', 'visibility', i === DATA.front.snapshots.length - 1 ? 'none' : 'visible');
  renderPanel();
}

document.querySelector('.modes').addEventListener('click', e => {
  const b = e.target.closest('.mode');
  if (!b) return;
  // pressing a view's button again resets it: close any open alert or region and snap the map back
  if (state.focusItem) clearFocus(true);
  if (state.selected && b.dataset.mode === 'regions') setSelected(null, false, true);
  setMode(b.dataset.mode);
});
document.querySelector('.modes').addEventListener('keydown', e => {
  if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
  const i = MODES.indexOf(state.mode), n = MODES[(i + (e.key === 'ArrowRight' ? 1 : MODES.length - 1)) % MODES.length];
  setMode(n); document.querySelector(`.mode[data-mode="${n}"]`).focus();
});
$('#livePill').addEventListener('click', () => { menu.hidden ? openMenu() : closeMenu(); });
$('#grip').addEventListener('click', () => {
  const ex = panel.classList.toggle('expanded');
  $('#grip').setAttribute('aria-expanded', String(ex));
});
panel.addEventListener('transitionend', e => { if (e.propertyName === 'max-height') { placeTbar(); if (mapReady && !isWide()) map.easeTo({padding: padding(), duration: REDUCED ? 0 : 300}); } });
const onPanelClick = e => {
  const itm = e.target.closest('[data-item]');
  if (itm) { focusItem(itm.dataset.item); return; }
  const reg = e.target.closest('[data-region]');
  if (reg) {
    if (state.mode !== 'regions') setMode('regions', false);
    setSelected(reg.dataset.region, true);
    return;
  }
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action, v = b.dataset.v;
  if (a === 'live') {
    state.liveOn = !state.liveOn;
    if (state.liveOn) { state.live.status = 'loading'; refreshAlerts(); } else { buildLiveItems(); updateLivePins(); clearFocus(true); }
    applyAlerts(); renderPanel();
  } else if (a === 'retry') { state.live.status = 'loading'; applyAlerts(); renderPanel(); refreshAlerts(); }
  else if (a === 'back') setSelected(null, false);
  else if (a === 'unfocus') { clearFocus(); frame('regions'); }
  else if (a === 'allalerts') openMenu();
  else if (a === 'frontfor') { setMode('front'); }
  else if (a === 'height') { state.heightBy = v; if (mapReady) { map.setPaintProperty('reg-3d', 'fill-extrusion-height', heightExpr()); applyMode(false); } renderPanel(); }
  else if (a === 'npreset') {
    state.night.preset = v;
    if (v === 'blackout') { state.night.date = '2022-11-23'; state.night.product = 'corrected'; }
    if (v === 'last') { state.night.date = new Date(Date.now() - 86400000).toISOString().slice(0, 10); state.night.product = 'raw'; }
    updateNight(); renderPanel();
  } else if (a === 'nprod') { state.night.product = v; updateNight(); renderPanel(); }
  else if (a === 'rv') { state.rvView = v; renderPanel(); applyMode(false); }
  else if (a === 'play') togglePlay();
};
pbody.addEventListener('click', onPanelClick);
document.getElementById('tPlay').addEventListener('click', togglePlay);
document.getElementById('tSlider').addEventListener('input', e => { stopPlay(); state.frontIdx = +e.target.value; setOcc(state.frontIdx); if (mapReady) map.setLayoutProperty('occ-latest', 'visibility', state.frontIdx === DATA.front.snapshots.length - 1 ? 'none' : 'visible'); updateTbar(); });
document.getElementById('tSlider').addEventListener('change', () => renderPanel());
document.getElementById('fsCard').addEventListener('click', onPanelClick);
document.getElementById('fsAlerts').addEventListener('click', () => { menu.hidden ? openMenu() : closeMenu(); });
pbody.addEventListener('input', e => {
  if (e.target.id === 'frontSlider') { stopPlay(); state.frontIdx = +e.target.value; setOcc(state.frontIdx); if (mapReady) map.setLayoutProperty('occ-latest', 'visibility', state.frontIdx === DATA.front.snapshots.length - 1 ? 'none' : 'visible'); }
  if (e.target.id === 'nightOpacity') { state.night.opacity = +e.target.value; if (mapReady && map.getLayer('night')) map.setPaintProperty('night', 'raster-opacity', state.night.opacity); }
});
pbody.addEventListener('change', e => {
  if (e.target.id === 'frontSlider') renderPanel();
  if (e.target.id === 'nightDate' && e.target.value) { state.night.date = e.target.value; state.night.preset = 'custom'; updateNight(); renderPanel(); }
});
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (MODES.includes(h) && h !== state.mode) setMode(h); });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { placeTbar(); frame(state.mode, false); }, 200); });

/* ---------------- Full screen ---------------- */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function setFullscreen(on) {
  if (document.body.classList.contains('fs') === on) return;
  document.body.classList.toggle('fs', on);
  $('#fsClose').hidden = !on;
  $('#fsAlerts').hidden = !on;
  closeMenu();
  renderFsCard();
  placeTbar();
  tip.hidden = true;
  const root = document.documentElement;
  try {
    if (on && !fsEl()) { const r = (root.requestFullscreen || root.webkitRequestFullscreen); if (r) { const pr = r.call(root); if (pr && pr.catch) pr.catch(() => {}); } }
    if (!on && fsEl()) { const x = (document.exitFullscreen || document.webkitExitFullscreen); if (x) { const pr = x.call(document); if (pr && pr.catch) pr.catch(() => {}); } }
  } catch (e) { /* the map-only view still works without browser full screen */ }
  (on ? $('#fsClose') : $('#fsOpen')).focus();
  if (mapReady) {
    setInteractive(on);
    setTimeout(() => {
      map.resize();
      const f = state.mode === 'regions' && state.focusItem;
      if (f) { map.setPadding({top: 0, bottom: 0, left: 0, right: 0}); const o = {center: f.ll, padding: padding()}; REDUCED ? map.jumpTo(o) : map.easeTo({...o, duration: 500}); }
      else frame(state.mode, !REDUCED);
    }, 120);
  }
}
$('#fsOpen').addEventListener('click', () => setFullscreen(true));
$('#fsClose').addEventListener('click', () => setFullscreen(false));
addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('fs')) setFullscreen(false); });
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { if (!fsEl() && document.body.classList.contains('fs')) setFullscreen(false); }));

/* ---------------- Boot ---------------- */
document.querySelectorAll('.mode').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === state.mode)));
renderPanel();
if (HAS_MAP) initMap();
else $('#map').innerHTML = '<div class="map-fail"><p>The 3D map needs WebGL and a connection to load its map engine. The details panel still works.</p></div>';
applyAlerts();
refreshAlerts();
refreshFront();
setInterval(() => { if (state.mode === 'regions' && state.live.status === 'ok') { const s = pbody.querySelector('.switch .s'); if (s && state.live.updated) s.textContent = `Updated ${kyivTime(state.live.updated)} Kyiv time (${ago(state.live.updated)}) · ${state.live.source}`; } }, 30000);
})();
</script>

</body>
</html>
