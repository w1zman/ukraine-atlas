name: Mirror air-raid alert feed

# Copies the public alerts.in.ua status report to the `live-data` branch every
# 5 minutes. The page reads it from there if the browser can't reach the feed directly.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: alerts-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch report
        run: curl -fsS --retry 2 --max-time 30 https://api.alerts.in.ua/v3/alerts/active.md -o active.md
      - name: Publish to live-data branch
        run: |
          git init -q -b live-data .
          git config user.name "alerts-mirror"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add active.md
          git commit -q -m "Alert snapshot $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live-data
